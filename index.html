<!DOCTYPE html>
<html>
<head>
<title>Partha | Personal Website</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

body {
    background: #0f172a;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 40px 15px;
}

.card {
    background: #1e293b;
    max-width: 350px;
    margin: auto;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px #0005;
}

.profile {
    width: 110px;
    height: 110px;
    background: white;
    color: #111827;
    border-radius: 50%;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
    font-weight: bold;
}

h1 {
    margin-top: 20px;
}

p {
    color: #cbd5e1;
}

button {
    background: white;
    color: #111827;
    border: none;
    padding: 12px 25px;
    border-radius: 10px;
    margin-top: 15px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #38bdf8;
    transform: scale(1.05);
}
</style>
</head>

<body>

<div class="card">

<div class="profile">P</div>

<h1>Partha Barua</h1>

<p>Beginner Web Developer 🚀</p>

<p>Learning HTML, CSS & JavaScript.</p>

<button onclick="alert('Welcome to Partha Website!')">
Say Hello
</button>

</div>

</body>
</html>
